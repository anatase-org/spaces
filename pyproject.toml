[project]
name = "spaces"
version = "0.0.1"
authors = [
  { name="Kapenekakis Antheas", email="pypi@antheas.dev" },
]
description = "Spaces. Develop on the distribution of your choice, securely."
readme = "readme.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
  "Pillow>=11.0",
  "rich>=13.5.2",
  "textual>=4.0",
]

[project.urls]
"Homepage" = "https://github.com/anatase-org/spaces"
"Bug Tracker" = "https://github.com/anatase-org/spaces/issues"

[project.entry-points."console_scripts"]
spaces = "spaces.__main__:main"
"spaces.priv" = "spaces.priv:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["spaces*"]

[tool.setuptools.package-data]
spaces = ["overlay/*.png"]

[tool.setuptools.data-files]
"share/polkit-1/actions" = ["data/org.anatase.spaces.policy"]
"share/spaces/pam" = [
  "data/pam/spaces.common-auth",
  "data/pam/spaces.system-auth",
  "data/pam/spaces.ubuntu",
  "data/pam/spaces.kali",
]
"share/spaces/keys" = [
  "data/keys/RPM-GPG-KEY-fedora-44-primary",
  "data/keys/kali-archive-key.asc",
  "data/keys/kali-archive-key.gpg.base64",
]
"share/spaces/repos" = ["data/repos/fedora.repo"]
"lib/systemd/system" = ["data/spaces@.service"]
"lib/systemd/user" = ["data/systemd/user/spaces@.service"]
"share/spaces/portal/dbus-1/services" = [
  "data/portal/dbus-1/services/org.freedesktop.FileManager1.service",
  "data/portal/dbus-1/services/org.freedesktop.Notifications.service",
  "data/portal/dbus-1/services/org.freedesktop.ScreenSaver.service",
  "data/portal/dbus-1/services/org.freedesktop.impl.portal.desktop.spaces.service",
  "data/portal/dbus-1/services/org.freedesktop.secrets.service",
  "data/portal/dbus-1/services/org.kde.secretservicecompat.service",
  "data/portal/dbus-1/services/org.kde.kwalletd5.service",
]
"share/spaces/portal/xdg-desktop-portal" = [
  "data/portal/xdg-desktop-portal/spaces-portals.conf",
]
"share/spaces/portal/xdg-desktop-portal/portals" = [
  "data/portal/xdg-desktop-portal/portals/spaces.portal",
]
"share/spaces/portal/systemd/user" = [
  "data/portal/systemd/user/spaces-graphical-session.target",
  "data/portal/systemd/user/spaces-portal.service",
]
"share/spaces/portal/config" = [
  "data/portal/config/kwalletrc",
]
